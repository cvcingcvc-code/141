# deploy.yml — GitHub Pages 发布（T4.1 / A4）
#
# ⚠️ 当前状态：**仅手动触发**（workflow_dispatch + 显式确认输入）。
#    原因：首次公开部署需用户明确批准（Wave 1 集成指令 B2）；main 合入不得自动公开站点。
#    T4.4 首次部署验收、且用户批准后，才允许恢复 `push: branches: [main]`。
#
# 链路（手动触发）：npm ci → validate（强制）→ build → upload-pages-artifact → deploy-pages
#
# 前置条件（触发前必须满足）：
#   1. 仓库 Settings → Pages → Source 选择 "GitHub Actions"；
#   2. 本 workflow 已在 main 上存在且 ci run 曾成功；
#   3. 用户已明确批准本次公开部署。

name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm_public_deploy:
        description: '输入 DEPLOY 表示确认公开部署到 GitHub Pages（未获用户批准请勿触发）'
        required: true
        default: 'hold'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 闸门：只有显式输入 DEPLOY 才继续，避免误触即公开
    if: ${{ github.event.inputs.confirm_public_deploy == 'DEPLOY' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node（.nvmrc）
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        run: npm ci

      # 部署前的最后一道数据门禁：内容不合法就不发
      - name: validate（内容校验，强制）
        run: npm run validate

      - name: build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
